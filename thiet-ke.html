<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Luryque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Bodoni+Moda:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb;
    --surface:#ffffff;
    --surface-2:#eef1f9;
    --ink:#161b2e;
    --muted:#5f6780;
    --line:#e1e5f0;
    --accent:#4658e5;
    --accent-2:#ffb020;
    --price:#dc2626;
    --on-accent:#ffffff;
    --shadow: 0 1px 2px rgba(22,27,46,.06), 0 10px 26px -14px rgba(22,27,46,.22);
    --card-h: 158px;
    --card-w: 134px;
    --catalog-mult: 1.2;
    --beads-pad-y: 10px;
    color-scheme: light;
  }
  /* Fixed light theme by request — intentionally ignores prefers-color-scheme / OS dark mode.
     --accent (indigo blue) marks anything actionable/interactive; --price (red) marks every
     money figure, so cost always reads at a glance. */

  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  html, body{ height:100%; margin:0; overflow:hidden; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"DM Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,.display{ font-family:"Bodoni Moda", "DM Sans", serif; font-weight:600; text-wrap:balance; }
  .tnum{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }

  .app{
    display:grid;
    grid-template-areas:
      "top"
      "stage"
      "catalog";
    grid-template-rows: auto 1fr auto;
    height:100vh;
    height:100dvh;
    gap:0;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    grid-area:top;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .brand-logo{ height:32px; width:auto; display:block; }
  .title-field{ flex:1; min-width:0; }
  .title-field input{
    width:100%; background:transparent; border:none; border-bottom:1px solid transparent;
    color:var(--ink); font-family:"Bodoni Moda"; font-weight:600; font-size:16px; padding:5px 2px;
  }
  .title-field input:hover{ border-bottom-color:var(--line); }
  .title-field input:focus{ outline:none; border-bottom-color:var(--accent); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .btn{ border-radius:999px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer; text-align:center; border:1px solid transparent; display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--on-accent); box-shadow:var(--shadow); }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:9px 15px; font-size:12.5px; }

  /* ---------- Stage ---------- */
  .stage{
    grid-area:stage; position:relative; display:flex; flex-direction:column; align-items:center;
    padding:18px 20px; min-height:0; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, var(--surface-2), transparent 62%), var(--bg);
  }
  .stage-toolbar{ position:relative; width:100%; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .stage-toolbar-right{ display:flex; align-items:center; gap:8px; }
  .stat-pill{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12px; color:var(--muted); box-shadow:var(--shadow); white-space:nowrap; }
  .stat-pill b{ color:var(--ink); font-weight:800; }
  .total-pill b{ color:var(--price); }
  .icon-btn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); box-shadow:var(--shadow); flex-shrink:0; }
  .icon-btn:hover{ color:var(--price); border-color:var(--price); }

  .ring-wrap{ flex:1; width:100%; min-height:0; position:relative; margin-top:6px; touch-action:none; }
  .ring-inner{ position:relative; width:100%; height:100%; }
  .ring-guide{ position:absolute; top:50%; left:50%; border:1.5px dashed var(--line); border-radius:50%; transform:translate(-50%,-50%); transition:width .25s ease, height .25s ease; }
  .placed-bead{
    position:absolute; top:50%; left:50%;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.2), inset 0 3px 5px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.18);
    cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none;
    transition: transform .18s cubic-bezier(.2,.8,.3,1.15), width .2s, height .2s;
  }
  .placed-bead:hover{ filter:brightness(1.07); z-index:4; }
  .placed-bead.dragging{ cursor:grabbing; z-index:10; filter:brightness(1.04); box-shadow: inset 0 -4px 8px rgba(0,0,0,.2), inset 0 3px 5px rgba(255,255,255,.35), 0 14px 28px rgba(0,0,0,.3); transition:none; }
  .placed-bead:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .empty-hint{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:var(--muted); font-size:13px; width:190px; }
  .empty-hint .display{ font-size:16px; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .ring-tip{ margin-top:6px; font-size:12px; color:var(--muted); text-align:center; min-height:16px; flex-shrink:0; }

  /* ---------- Bottom catalog bar ---------- */
  .rail-catalog{
    grid-area:catalog;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--surface);
    /* card-h * mult is the usable (padding-excluded) row area; add the fam-beads padding back so
       the on-screen ratio of catalog-height : card-height actually reads as the intended multiple,
       instead of the padding silently eating into it and making the peek-of-next-row disappear. */
    height: calc(var(--card-h) * var(--catalog-mult) + var(--beads-pad-y) * 2);
    flex-shrink:0;
  }
  .fam-collist{
    width:150px; flex-shrink:0;
    display:flex; flex-direction:column; gap:6px;
    padding:10px; overflow-y:auto;
    border-right:1px solid var(--line);
  }
  .fam-bar{
    width:100%; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:none; border-radius:10px; padding:11px 12px; font-size:12.5px; font-weight:700; cursor:pointer;
    transition:filter .12s, outline-color .12s;
  }
  .fam-bar:hover{ filter:brightness(1.07); }
  .fam-bar .fam-count{ font-weight:600; opacity:.85; font-size:11px; }
  .fam-bar.active{ outline:2px solid var(--ink); outline-offset:2px; }

  .fam-beads{
    flex:1; min-width:0; overflow-y:auto; overflow-x:hidden;
    padding: var(--beads-pad-y) 12px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:10px;
  }
  /* Fixed width, not flex-grow: a card is always exactly --card-w wide. If the next card doesn't
     fit in what's left of the row, it wraps to a new line instead of every card stretching to fill
     the row — otherwise the same family renders at a different card width depending on how many
     happen to land in a row (8-across vs. a leftover row of 5 looked visibly inconsistent). */
  .bead-card{
    position:relative; box-sizing:border-box;
    border:1px solid var(--line); background:var(--bg); border-radius:14px;
    padding:10px 8px 8px; cursor:pointer; text-align:center; overflow:hidden;
    height:var(--card-h); width:var(--card-w); flex:0 0 auto;
    display:flex; flex-direction:column;
    transition:transform .1s, border-color .12s, box-shadow .12s;
  }
  /* Fixed-size slot: every illustration centers and grows to fill it (capped by whichever of
     width/height it hits first), so a flat disc and a tall charm both read as "equally large" —
     only name/mm/price are pinned to the card's bottom edge via .bead-info's margin-top:auto. */
  .bead-img-slot{ width:100%; height:68px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .bead-info{ margin-top:auto; display:flex; flex-direction:column; gap:5px; }
  .bead-card:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow); }
  .bead-card:active{ transform:translateY(0); }
  .info-btn{
    position:absolute; top:6px; right:6px; width:19px; height:19px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-size:11px; font-weight:800; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:1; transition:opacity .15s ease, border-color .12s, color .12s;
  }
  .info-btn:hover{ border-color:var(--accent); color:var(--accent); }

  /* Every shape fills the same fixed square box — round/oval/disc/cube/tube/drop all render at
     60x60. Squishing a flat disc/oval/tube into a true-to-life ellipse reads as a rendering glitch
     (the sphere-lighting gradient is tuned for a circle, not a lens shape), so those stay full
     circles and are told apart by name/mm text instead of silhouette. Only the charm SVG glyph
     (a genuinely different asset, not a gradient sphere) keeps its natural vertical pendant shape. */
  .bead-swatch{
    width:60px; height:60px; flex-shrink:0;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.18), inset 0 3px 5px rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.15);
  }
  .bead-swatch.shape-charm{ width:42px; height:60px; }

  .shape-round, .shape-oval, .shape-disc{ border-radius:50%; }
  .shape-cube{ border-radius:20%; }
  .shape-tube{ border-radius:40%; }
  .shape-drop{ border-radius:58% 58% 58% 6%; }
  .shape-star{ border-radius:0; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
  .shape-charm{ box-shadow:none; background:none; }

  .bead-name{ font-size:11.5px; font-weight:700; line-height:1.25; min-height:2.5em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bead-mm{ font-size:10px; color:var(--muted); line-height:1.15; }
  .bead-price{ line-height:1.15; white-space:nowrap; }
  .bead-price .now{ font-weight:800; font-size:12px; color:var(--price); }
  .bead-price .was{ font-size:10px; color:var(--muted); text-decoration:line-through; margin-left:4px; }
  .empty-catalog{ width:100%; padding:20px 10px; text-align:center; color:var(--muted); font-size:13px; }

  /* ---------- Info / checkout modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,16,28,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-backdrop[hidden]{ display:none; }
  .modal-card{ position:relative; background:var(--surface); border-radius:18px; padding:22px; width:min(420px, 100%); box-shadow:0 24px 60px -20px rgba(0,0,0,.45); max-height:90vh; overflow-y:auto; }
  .modal-close{ position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:16px; cursor:pointer; }
  .modal-card h3{ font-size:19px; font-weight:800; margin:0 0 2px; padding-right:24px; }
  .modal-sub{ font-size:12.5px; color:var(--muted); margin:0 0 16px; }
  .modal-gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .gallery-tile{ display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 6px; }
  .gallery-shape{ width:40px; height:40px; box-shadow: inset 0 -4px 8px rgba(0,0,0,.2), inset 0 3px 5px rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.15); }
  .gallery-shape.shape-oval{ width:48px; height:29px; }
  .gallery-shape.shape-cube{ width:34px; height:34px; }
  .gallery-shape.shape-disc{ width:46px; height:21px; }
  .gallery-shape.shape-drop{ width:32px; height:40px; }
  .gallery-shape.shape-tube{ width:50px; height:23px; }
  .gallery-shape.shape-charm{ width:26px; height:42px; transition:transform .2s ease; }
  .gallery-tile span{ font-size:10.5px; color:var(--muted); text-align:center; }
  .modal-note{ font-size:11.5px; color:var(--muted); margin:0; text-align:center; }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px){
    :root{ --card-h: 122px; --card-w: 132px; --catalog-mult: 2.2; --beads-pad-y: 8px; }
    .topbar{ padding:10px 14px; gap:8px; }
    .brand-logo{ height:26px; }
    .title-field input{ font-size:15px; }
    .btn{ padding:9px 13px; font-size:12px; }
    .stage{ padding:12px 14px; }
    .stat-pill{ font-size:11px; padding:6px 10px; }
    .icon-btn{ width:34px; height:34px; }
    .fam-collist{ width:100px; padding:8px 6px; gap:5px; }
    .fam-bar{ padding:9px 8px; font-size:11px; }
    .fam-beads{ padding:8px; gap:8px; }
    .bead-img-slot{ height:48px; }
    .bead-swatch{ width:42px; height:42px; }
    .bead-swatch.shape-charm{ width:30px; height:42px; }
    .bead-name{ font-size:10.5px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" style="text-decoration:none;">
      <img src="logo.png" alt="Luryque" class="brand-logo">
    </a>
    <div class="title-field">
      <input id="designTitle" type="text" value="Chưa đặt tên thiết kế" maxlength="60" aria-label="Tên thiết kế">
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="inspireBtn" title="Gợi ý phối màu ngẫu nhiên">Gợi ý mẫu</button>
      <button class="btn btn-primary btn-sm" id="checkoutBtn">Thanh toán</button>
    </div>
  </header>

  <main class="stage">
    <div class="stage-toolbar">
      <div class="stat-pill">Chu vi ước tính <b id="wristVal" class="tnum">— cm</b></div>
      <div class="stage-toolbar-right">
        <div class="stat-pill total-pill">Tổng <b id="pillTotal" class="tnum">0 đ</b></div>
        <button class="icon-btn" id="clearBtn" title="Xoá hết hạt trên chuỗi" aria-label="Xoá hết">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"/></svg>
        </button>
      </div>
    </div>
    <div class="ring-wrap">
      <div class="ring-inner" id="ringInner">
        <div class="ring-guide" id="ringGuide"></div>
        <div class="empty-hint" id="emptyHint">
          <div class="display">Chuỗi trống</div>
          Bấm vào 1 viên hạt bên dưới để bắt đầu xâu chuỗi
        </div>
      </div>
    </div>
    <div class="ring-tip" id="ringTip"></div>
  </main>

  <aside class="rail-catalog">
    <div class="fam-collist" id="famList"></div>
    <div class="fam-beads" id="famBeadsGrid"></div>
  </aside>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Đóng">×</button>
    <h3 id="modalTitle"></h3>
    <p class="modal-sub" id="modalSub"></p>
    <div class="modal-gallery" id="modalGallery"></div>
    <p class="modal-note">Ảnh minh hoạ dựng bằng màu — sẽ thay bằng ảnh chụp thực tế khi có.</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Families (material colors — placeholder swatches, no external images) ----------
  var FAMILIES = [
    {id:"trang", label:"Trắng", light:"#faf7f4", dark:"#d3c9c2"},

    {id:"vang",  label:"Vàng",  light:"#f5d888", dark:"#b6811a"},

  ];
  var FMAP = {}; FAMILIES.forEach(function(f){ FMAP[f.id]=f; });

  // ---------- Shapes (geometry via CSS classes shape-*; numbers here only drive layout math) ----------
  // "charm" is drawn as an SVG glyph (attachment loop at its own top, pendant body at its own
  // bottom) instead of a gradient sphere — see charmSvgMarkup().

    round:{ wMul:1,    hMul:1,    footMul:1    },

    tube: { wMul:2.15, hMul:0.8,  footMul:2.05 },
    charm:{ wMul:1.0,  hMul:1.6,  footMul:0.6  }

  var CATALOG = [
    {id:"agate-white",  name:"Mã Não Trắng",              fam:"trang", shape:"round", mm:8,  price:24000, was:32000},

    {id:"tigereye",     name:"Mắt Hổ Vàng",               fam:"vang",  shape:"round", mm:10, price:32000, was:43000},
    {id:"aventurine",   name:"Aventurine Xanh",           fam:"la",    shape:"round", mm:10, price:32000, was:43000},
    {id:"amazonite",    name:"Amazonite Xanh Lam",        fam:"duong", shape:"round", mm:8,  price:24000, was:32000},
    {id:"amethyst",     name:"Thạch Anh Tím",             fam:"tim",   shape:"round", mm:8,  price:34000, was:46000},
    {id:"sugilite",     name:"Sugilite Tím",              fam:"tim",   shape:"round", mm:6,  price:26000, was:35000},
    {id:"obsidian",     name:"Obsidian Đen",              fam:"den",   shape:"round", mm:10, price:32000, was:43000},
    {id:"onyx",         name:"Onyx Đen",                  fam:"den",   shape:"round", mm:8,  price:24000, was:32000},
    {id:"spacer-round", name:"Charm Tròn Vàng",           fam:"kim",   shape:"round", mm:4,  price:8000,  was:12000},

    {id:"quartz-rose-rice", name:"Thạch Anh Hồng Dạng Gạo", fam:"hong", shape:"oval", mm:8, price:30000, was:40000},
    {id:"jade-rice",        name:"Ngọc Bích Dạng Gạo",      fam:"la",   shape:"oval", mm:8, price:30000, was:40000},

    {id:"amethyst-cube", name:"Thạch Anh Tím Vuông", fam:"tim",   shape:"cube", mm:8, price:36000, was:48000},
    {id:"lapis-cube",    name:"Lapis Lazuli Vuông",  fam:"duong", shape:"cube", mm:8, price:40000, was:53000},

    {id:"clay-white-disc", name:"Đĩa Sứ Trắng",   fam:"trang", shape:"disc", mm:6, price:14000, was:19000},
    {id:"onyx-disc",       name:"Đĩa Onyx Đen",   fam:"den",   shape:"disc", mm:6, price:18000, was:24000},

    {id:"pearl-baroque-white",  name:"Ngọc Trai Baroque Trắng",   fam:"trang", shape:"drop",  mm:9,  price:28000, was:37000},
    {id:"mop-cube-white",       name:"Xà Cừ Trắng Vuông",         fam:"trang", shape:"cube",  mm:8,  price:26000, was:35000},
    {id:"moonstone-white",      name:"Đá Mặt Trăng Trắng",        fam:"trang", shape:"round", mm:8,  price:38000, was:50000},
    {id:"coral-star-white",     name:"San Hô Trắng Hình Sao",     fam:"trang", shape:"star",  mm:9,  price:22000, was:29000},
    {id:"tube-porcelain-white", name:"Ống Sứ Trắng Nhỏ",          fam:"trang", shape:"tube",  mm:6,  price:13000, was:18000},
    {id:"agate-white-rice",     name:"Mã Não Trắng Dạng Gạo",     fam:"trang", shape:"oval",  mm:9,  price:27000, was:36000},
    {id:"pearl-white-mini",     name:"Ngọc Trai Trắng Mini",      fam:"trang", shape:"round", mm:4,  price:16000, was:22000},
    {id:"milkstone-white-round",name:"Đá Trắng Sữa Tròn Lớn",     fam:"trang", shape:"round", mm:12, price:42000, was:56000},
    {id:"mop-drop-white",       name:"Xà Cừ Trắng Giọt Nước",     fam:"trang", shape:"drop",  mm:9,  price:31000, was:41000},
    {id:"charm-heart-pearl",    name:"Charm Trái Tim Ngọc Trai",  fam:"trang", shape:"charm", charmType:"heart", mm:10, price:34000, was:45000},

    {id:"star-gold", name:"Charm Ngôi Sao Vàng", fam:"kim", shape:"star", mm:8, price:15000, was:20000},

    {id:"garnet-drop",      name:"Garnet Giọt Nước",           fam:"do",   shape:"drop", mm:10, price:38000, was:50000},
    {id:"quartz-rose-drop", name:"Thạch Anh Hồng Giọt Nước",   fam:"hong", shape:"drop", mm:10, price:36000, was:48000},

    {id:"tube-gold", name:"Ống Vàng Nhỏ",  fam:"kim", shape:"tube", mm:6, price:12000, was:16000},
    {id:"tube-onyx", name:"Ống Onyx Nhỏ",  fam:"den", shape:"tube", mm:6, price:16000, was:21000},

    {id:"charm-key",   name:"Charm Chìa Khoá Bạc", fam:"bac", shape:"charm", charmType:"key",   mm:11, price:45000, was:60000},
    {id:"charm-heart", name:"Charm Trái Tim Vàng", fam:"kim", shape:"charm", charmType:"heart", mm:10, price:42000, was:56000}
  ];
  var CMAP = {}; CATALOG.forEach(function(c){ CMAP[c.id]=c; });

  var fmtVND = new Intl.NumberFormat("vi-VN");
  function money(n){ return fmtVND.format(n) + " đ"; }
  // Picks readable chip text (near-black or white) for a given background hex — YIQ perceived brightness.
  function contrastText(hex){
    var h = hex.replace("#","");
    var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    var yiq = (r*299 + g*587 + b*114) / 1000;
    return yiq >= 150 ? "#161b2e" : "#ffffff";
  }
  function swatchBackground(famId){
    var f = FMAP[famId];
    return "radial-gradient(circle at 32% 26%, rgba(255,255,255,.9), rgba(255,255,255,0) 38%)," +
      "radial-gradient(circle at 68% 74%, rgba(0,0,0,.28), rgba(0,0,0,0) 48%)," +
      "radial-gradient(circle at 50% 45%, " + f.light + ", " + f.dark + " 88%)";
  }
  function charmSvgMarkup(type, famId){
    var f = FMAP[famId];
    // "trang" (white)'s light/dark pair are both near-white, so its own f.dark reads as a faint,
    // washed-out outline for line-art (unlike a gradient sphere, which still reads fine that pale) —
    // use a deeper neutral just for the charm linework so it stays legible on the page's light bg.
    var line = famId === "trang" ? "#9c9088" : f.dark;
    var svgOpen = '<svg viewBox="0 0 40 64" width="100%" height="100%" style="display:block;overflow:visible;">';
    if(type === "key"){
      return svgOpen +
        '<circle cx="20" cy="15" r="10" fill="none" stroke="' + line + '" stroke-width="5"/>' +
        '<circle cx="20" cy="15" r="10" fill="none" stroke="' + f.light + '" stroke-width="1.4" opacity=".65"/>' +
        '<rect x="17" y="25" width="6" height="27" rx="1.5" fill="' + line + '"/>' +
        '<rect x="23" y="42" width="7" height="5" fill="' + line + '"/>' +
        '<rect x="23" y="50" width="5" height="5" fill="' + line + '"/>' +
        '</svg>';
    }
    return svgOpen +
      '<circle cx="20" cy="9" r="6" fill="none" stroke="' + line + '" stroke-width="3"/>' +
      '<line x1="20" y1="15" x2="20" y2="27" stroke="' + line + '" stroke-width="2.5"/>' +
      '<path d="M20 55 C 7 44, 5 33, 14 31 C 18 30, 20 33.5, 20 36 C 20 33.5, 22 30, 26 31 C 35 33, 33 44, 20 55 Z" fill="' + line + '"/>' +
      '<path d="M20 55 C 7 44, 5 33, 14 31 C 18 30, 20 33.5, 20 36" fill="none" stroke="' + f.light + '" stroke-width="1" opacity=".55"/>' +
      '</svg>';
  }
  // Applies a catalog item's visual to a swatch/placed-bead/gallery element — gradient sphere for
  // regular beads, an SVG glyph for charms. Reused across all render contexts so they stay in sync.
  function applyBeadVisual(el, c){
    if(c.shape === "charm"){
      el.style.background = "none";
      el.innerHTML = charmSvgMarkup(c.charmType, c.fam);
    } else {
      el.style.background = swatchBackground(c.fam);
      el.innerHTML = "";
    }
  }

  // ---------- State ----------
  var ring = [];       // array of {uid, id}
  var nextUid = 1;
  var beadEls = {};    // uid -> DOM element (stable across renders, required for smooth drag)
  var userScale = 1;
  var dragState = null;
  var activeFam = null;

  var PX_PER_MM = 5.6;
  var MIN_R = 72, MAX_R = 188, DEFAULT_R = 108;

  function normAngle(a){
    var TWO_PI = Math.PI*2, START = -Math.PI/2;
    var v = (a - START) % TWO_PI;
    if(v < 0) v += TWO_PI;
    return START + v;
  }

  // Pure layout function — used for the live ring AND to preview drag-target order.
  function computeLayout(list){
    if(list.length === 0) return { r: DEFAULT_R, items: [] };
    var meta = list.map(function(b){
      var c = CMAP[b.id], sd = SHAPE_DEF[c.shape], d0 = c.mm * PX_PER_MM;
      return { uid:b.uid, id:b.id, sd:sd, d0:d0, foot0: d0 * sd.footMul };
    });
    var circumference = meta.reduce(function(s,m){ return s + m.foot0; }, 0);
    var rawR = circumference / (2*Math.PI);
    var r = Math.max(MIN_R, Math.min(MAX_R, rawR));
    var fit = rawR > MAX_R ? MAX_R / rawR : 1;
    var angle = -Math.PI/2;
    var items = meta.map(function(m){
      var foot = m.foot0 * fit;
      var half = (foot/2) / r;
      angle += half;
      var a = angle;
      var x = Math.cos(a) * r, y = Math.sin(a) * r;
      angle += half;
      var d = m.d0 * fit;
      // Rotate every bead to match its position on the string: elongated shapes (oval/tube/disc)
      // end up lying tangent to the ring's curve, and charms swing with their attachment loop
      // toward the string and their pendant body pointing outward — see charm authoring convention
      // in charmSvgMarkup (loop at local top, body at local bottom).
      var rot = (a * 180 / Math.PI) - 90;
      return { uid:m.uid, id:m.id, angle:a, x:x, y:y, w:d*m.sd.wMul, h:d*m.sd.hMul, rot:rot };
    });
    return { r:r, items:items };
  }

  // ---------- Family selector (bottom bar, left column) ----------
  // Colors are a flat single-select list; picking one shows that color's beads in the
  // grid to its right, instead of an accordion — the bottom bar is too short to expand in place.
  var famList = document.getElementById("famList");
  var famBeadsGrid = document.getElementById("famBeadsGrid");
  var famBarEls = {};

  FAMILIES.forEach(function(f){
    var bar = document.createElement("button");
    bar.type = "button";
    bar.className = "fam-bar";
    bar.setAttribute("aria-pressed", "false");
    // "Trắng" would be near-invisible on the page's own light background at its true bead tone,
    // so the bar itself (not the bead gradient elsewhere) gets pure white + a thin dark edge.
    var barBg = f.id === "trang" ? "#ffffff" : f.dark;
    bar.style.background = barBg;
    bar.style.color = contrastText(barBg);
    if(f.id === "trang"){ bar.style.border = "1.5px solid #1a1a1a"; }
    bar.innerHTML = '<span>' + f.label + '</span><span class="fam-count tnum"></span>';
    bar.addEventListener("click", function(){ selectFamily(f.id); });
    famList.appendChild(bar);
    famBarEls[f.id] = bar;
  });

  function familyItems(famId){
    return CATALOG.filter(function(c){ return c.fam === famId; });
  }

  function selectFamily(famId){
    activeFam = famId;
    FAMILIES.forEach(function(f){
      var isActive = f.id === famId;
      famBarEls[f.id].classList.toggle("active", isActive);
      famBarEls[f.id].setAttribute("aria-pressed", isActive ? "true" : "false");
    });
    renderBeadsGrid();
  }

  function renderBeadsGrid(){
    var items = activeFam ? familyItems(activeFam) : [];
    famBeadsGrid.innerHTML = "";
    if(items.length === 0){
      var e = document.createElement("div");
      e.className = "empty-catalog"; e.textContent = "Chưa có hạt cho màu này.";
      famBeadsGrid.appendChild(e);
      return;
    }
    items.forEach(function(c){
      var card = document.createElement("div");
      card.className = "bead-card"; card.tabIndex = 0;
      card.setAttribute("role","button");
      card.setAttribute("aria-label", "Thêm " + c.name + " vào chuỗi");
      card.innerHTML =
        '<button type="button" class="info-btn" aria-label="Xem thêm ảnh thực tế của ' + c.name + '" title="Xem ảnh thực tế">?</button>' +
        '<div class="bead-img-slot"><div class="bead-swatch shape-' + c.shape + '"></div></div>' +
        '<div class="bead-info">' +
          '<div class="bead-name">' + c.name + '</div>' +
          '<div class="bead-mm">' + c.mm + 'mm</div>' +
          '<div class="bead-price"><span class="now tnum">' + money(c.price) + '</span><span class="was tnum">' + money(c.was) + '</span></div>' +
        '</div>';
      applyBeadVisual(card.querySelector(".bead-swatch"), c);
      card.querySelector(".info-btn").addEventListener("click", function(ev){ ev.stopPropagation(); openModal(c.id); });
      card.addEventListener("click", function(){ addBead(c.id); });
      card.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); addBead(c.id); } });
      famBeadsGrid.appendChild(card);
    });
  }

  function renderCatalog(){
    FAMILIES.forEach(function(f){
      var n = familyItems(f.id).length;
      famBarEls[f.id].querySelector(".fam-count").textContent = n > 0 ? String(n) : "";
    });
    if(!activeFam){
      var firstWithItems = FAMILIES.filter(function(f){ return familyItems(f.id).length > 0; })[0];
      if(firstWithItems) selectFamily(firstWithItems.id);
    }
  }

  // ---------- Ring render ----------
  var ringInner = document.getElementById("ringInner");
  var ringGuide = document.getElementById("ringGuide");
  var emptyHint = document.getElementById("emptyHint");
  var ringTip = document.getElementById("ringTip");
  var pillTotal = document.getElementById("pillTotal");
  var wristVal = document.getElementById("wristVal");

  function render(){
    var layout = computeLayout(ring);
    ringGuide.style.width = ringGuide.style.height = (layout.r*2) + "px";
    emptyHint.style.display = ring.length === 0 ? "block" : "none";
    ringTip.textContent = ring.length > 0 ? "Kéo hạt để đổi vị trí · Bấm để gỡ" : "";

    var seen = {};
    layout.items.forEach(function(it){
      seen[it.uid] = true;
      var el = beadEls[it.uid];
      if(!el){
        el = document.createElement("div");
        el.tabIndex = 0;
        el.setAttribute("role","button");
        ringInner.appendChild(el);
        beadEls[it.uid] = el;
        attachBeadInteraction(el, it.uid);
      }
      el.className = "placed-bead shape-" + CMAP[it.id].shape + (dragState && dragState.uid===it.uid && dragState.moved ? " dragging" : "");
      el.style.width = it.w + "px";
      el.style.height = it.h + "px";
      applyBeadVisual(el, CMAP[it.id]);
      el.setAttribute("aria-label", CMAP[it.id].name + " — kéo để đổi vị trí, bấm hoặc nhấn Delete để gỡ");
      el.title = CMAP[it.id].name;
      if(!(dragState && dragState.moved && dragState.uid === it.uid)){
        el.style.transform = "translate(calc(-50% + " + it.x + "px), calc(-50% + " + it.y + "px)) rotate(" + it.rot.toFixed(2) + "deg)";
      }
    });
    Object.keys(beadEls).forEach(function(uid){
      if(!seen[uid]){ beadEls[uid].remove(); delete beadEls[uid]; }
    });

    var totalMm = ring.reduce(function(s,b){ return s + CMAP[b.id].mm; }, 0);
    wristVal.textContent = ring.length ? (totalMm/10).toFixed(1) + " cm" : "— cm";
    var totalPrice = ring.reduce(function(s,b){ return s + CMAP[b.id].price; }, 0);
    pillTotal.textContent = money(totalPrice);
  }

  function applyUserScale(){ ringInner.style.transform = "scale(" + userScale + ")"; }

  function addBead(id){ ring.push({ uid: nextUid++, id: id }); render(); }
  function removeInstance(uid){ ring = ring.filter(function(b){ return b.uid !== uid; }); render(); }

  document.getElementById("clearBtn").addEventListener("click", function(){
    if(ring.length===0) return;
    ring = []; render();
  });

  // ---------- Drag-to-reorder + click/Delete-to-remove ----------
  function attachBeadInteraction(el, uid){
    el.addEventListener("pointerdown", function(e){
      if(e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      dragState = { uid:uid, pointerId:e.pointerId, moved:false, startX:e.clientX, startY:e.clientY };
    });

    el.addEventListener("pointermove", function(e){
      if(!dragState || dragState.pointerId !== e.pointerId || dragState.uid !== uid) return;
      var dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
      if(!dragState.moved){
        if(Math.hypot(dx,dy) < 5) return;
        dragState.moved = true;
        el.classList.add("dragging");
      }
      e.preventDefault();

      var rect = ringInner.getBoundingClientRect();
      var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      var lx = (e.clientX - cx) / userScale, ly = (e.clientY - cy) / userScale;
      var dragRot = (Math.atan2(ly, lx) * 180 / Math.PI) - 90;
      el.style.transform = "translate(calc(-50% + " + lx + "px), calc(-50% + " + ly + "px)) scale(1.16) rotate(" + dragRot.toFixed(2) + "deg)";

      var curIdx = ring.findIndex(function(b){ return b.uid === uid; });
      if(curIdx === -1) return;
      var working = ring.slice(); working.splice(curIdx,1);
      var wl = computeLayout(working).items;
      var na = normAngle(Math.atan2(ly, lx));
      var newIdx = 0;
      for(var i=0; i<wl.length; i++){
        if(normAngle(wl[i].angle) < na) newIdx++; else break;
      }
      if(newIdx !== curIdx){
        var item = ring.splice(curIdx,1)[0];
        ring.splice(newIdx,0,item);
      }
      render();
    });

    function endDrag(e){
      if(!dragState || dragState.pointerId !== e.pointerId || dragState.uid !== uid) return;
      var moved = dragState.moved;
      try{ el.releasePointerCapture(e.pointerId); }catch(err){}
      dragState = null;
      if(moved){ render(); } else { removeInstance(uid); }
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
    el.addEventListener("keydown", function(e){
      if(e.key==="Delete" || e.key==="Backspace"){ e.preventDefault(); removeInstance(uid); }
    });
  }

  // ---------- Zoom (directly on the ring — no visible control) ----------
  var MIN_SCALE = 0.7, MAX_SCALE = 1.6;
  function clampScale(v){ return Math.max(MIN_SCALE, Math.min(MAX_SCALE, v)); }
  var ringWrap = document.querySelector(".ring-wrap");

  // Mouse wheel AND laptop trackpad both fire as "wheel" — a trackpad pinch adds ctrlKey with a
  // small deltaY per event, a mouse wheel fires larger discrete steps; exponential scaling makes
  // both feel equally smooth regardless of that difference in granularity.
  ringWrap.addEventListener("wheel", function(e){
    e.preventDefault();
    var factor = Math.exp(-e.deltaY * 0.0018);
    userScale = clampScale(userScale * factor);
    applyUserScale();
  }, { passive: false });

  // Two-finger touch pinch — phones/tablets have no wheel event, and this was the only zoom
  // control mobile had, so pinch replaces it there.
  var pinchStartDist = null, pinchStartScale = 1;
  function touchDist(t0, t1){ return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY); }
  ringWrap.addEventListener("touchstart", function(e){
    if(e.touches.length === 2){
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = userScale;
    }
  }, { passive: true });
  ringWrap.addEventListener("touchmove", function(e){
    if(e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      var dist = touchDist(e.touches[0], e.touches[1]);
      userScale = clampScale(pinchStartScale * (dist / pinchStartDist));
      applyUserScale();
    }
  }, { passive: false });
  ringWrap.addEventListener("touchend", function(e){
    if(e.touches.length < 2) pinchStartDist = null;
  });

  // ---------- Inspire ----------
  document.getElementById("inspireBtn").addEventListener("click", function(){
    var pairs = [
      {fams:["hong","kim","trang"], n:9}, {fams:["duong","kim","trang"], n:8},
      {fams:["tim","kim"], n:8}, {fams:["la","kim","trang"], n:9},
      {fams:["den","kim","vang"], n:8}, {fams:["do","kim","trang"], n:9}
    ];
    var pick = pairs[Math.floor(Math.random()*pairs.length)];
    var pool = CATALOG.filter(function(c){ return pick.fams.indexOf(c.fam) !== -1; });
    var out = [];
    for(var i=0;i<pick.n;i++){ out.push(pool[Math.floor(Math.random()*pool.length)].id); }
    ring = out.map(function(id){ return { uid: nextUid++, id: id }; });
    render();
  });

  // ---------- Info / checkout modal ----------
  var DEFAULT_MODAL_NOTE = "Ảnh minh hoạ dựng bằng màu — sẽ thay bằng ảnh chụp thực tế khi có.";
  var modalBackdrop = document.getElementById("modalBackdrop");

  function openModal(id){
    var c = CMAP[id];
    document.getElementById("modalTitle").textContent = c.name;
    document.getElementById("modalSub").textContent = c.mm + "mm · " + FMAP[c.fam].label;
    document.querySelector(".modal-note").textContent = DEFAULT_MODAL_NOTE;
    var gal = document.getElementById("modalGallery");
    gal.innerHTML = "";
    if(c.shape === "charm"){
      // Charms auto-rotate to face the string — show that instead of a fake lighting variant.
      var spins = [ {deg:0, label:"Ở đầu dây"}, {deg:-90, label:"Ở cạnh dây"}, {deg:180, label:"Ở cuối dây"} ];
      spins.forEach(function(sVariant){
        var tile = document.createElement("div");
        tile.className = "gallery-tile";
        var shape = document.createElement("div");
        shape.className = "gallery-shape shape-charm";
        shape.style.transform = "rotate(" + sVariant.deg + "deg)";
        shape.innerHTML = charmSvgMarkup(c.charmType, c.fam);
        var span = document.createElement("span");
        span.textContent = sVariant.label;
        tile.appendChild(shape); tile.appendChild(span);
        gal.appendChild(tile);
      });
    } else {
      var variants = [ {pos:"32% 26%", label:"Góc nghiêng"}, {pos:"60% 65%", label:"Cận cảnh"}, {pos:"50% 15%", label:"Dưới ánh sáng"} ];
      variants.forEach(function(v){
        var tile = document.createElement("div");
        tile.className = "gallery-tile";
        var bg = "radial-gradient(circle at " + v.pos + ", rgba(255,255,255,.9), rgba(255,255,255,0) 40%)," +
                 "radial-gradient(circle at 70% 80%, rgba(0,0,0,.28), rgba(0,0,0,0) 46%)," +
                 "radial-gradient(circle at 50% 50%, " + FMAP[c.fam].light + ", " + FMAP[c.fam].dark + " 88%)";
        var shape = document.createElement("div");
        shape.className = "gallery-shape shape-" + c.shape;
        shape.style.background = bg;
        var span = document.createElement("span");
        span.textContent = v.label;
        tile.appendChild(shape); tile.appendChild(span);
        gal.appendChild(tile);
      });
    }
    modalBackdrop.hidden = false;
  }

  function openCheckout(){
    var titleEl = document.getElementById("modalTitle");
    var subEl = document.getElementById("modalSub");
    var gal = document.getElementById("modalGallery");
    var noteEl = document.querySelector(".modal-note");

    if(ring.length === 0){
      titleEl.textContent = "Chuỗi đang trống";
      subEl.textContent = "";
      gal.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;margin:0;">Hãy chọn ít nhất 1 viên hạt trước khi thanh toán.</p>';
      noteEl.textContent = "";
      modalBackdrop.hidden = false;
      return;
    }
    var total = ring.reduce(function(s,b){ return s + CMAP[b.id].price; }, 0);
    var totalMm = ring.reduce(function(s,b){ return s + CMAP[b.id].mm; }, 0);
    titleEl.textContent = "Xác nhận đơn hàng";
    subEl.textContent = document.getElementById("designTitle").value;
    gal.innerHTML =
      '<div style="grid-column:1/-1;display:flex;flex-direction:column;gap:10px;">' +
        '<div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--muted);">Số hạt</span><b>' + ring.length + '</b></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--muted);">Chu vi ước tính</span><b>' + (totalMm/10).toFixed(1) + ' cm</b></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:16px;border-top:1px solid var(--line);padding-top:10px;"><span style="color:var(--muted);">Tổng tiền</span><b style="color:var(--price);">' + money(total) + '</b></div>' +
      '</div>';
    noteEl.textContent = "Đây là bản xem trước thiết kế — liên hệ Luryque để hoàn tất đặt hàng và thanh toán.";
    modalBackdrop.hidden = false;
  }
  document.getElementById("checkoutBtn").addEventListener("click", openCheckout);

  function closeModal(){ modalBackdrop.hidden = true; }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function(e){ if(e.target===modalBackdrop) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !modalBackdrop.hidden) closeModal(); });

  // ---------- Init ----------
  renderCatalog();
  render();
})();
</script>
</body>
</html>
